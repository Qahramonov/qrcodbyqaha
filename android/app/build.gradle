plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chathelper.control'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chathelper.control'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            // Provide via environment (CI secrets) or keystore.properties; falls back to the debug key.
            def ks = System.getenv('CH_KEYSTORE') ?: '../chat_helper_control.keystore'
            if (file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('CH_KS_PASS') ?: 'chathelper'
                keyAlias System.getenv('CH_KEY_ALIAS') ?: 'chathelper'
                keyPassword System.getenv('CH_KS_PASS') ?: 'chathelper'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
